# Render blueprint for the Express API. Create it with: Render dashboard > New > Blueprint > this repo.
services:
  - type: web
    name: asta-api
    runtime: node
    plan: free
    rootDir: server
    # devDependencies (typescript) are needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL # Supabase connection string (session pooler URI), set in the dashboard
        sync: false
      - key: DATABASE_SSL
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL # this service's own https URL, e.g. https://asta-api.onrender.com
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_REDIRECT_SCHEMES
        value: asta
